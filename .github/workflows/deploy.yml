name: Deploy
on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-railway:
    name: deploy to railway
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install railway cli
        run: npm i -g @railway/cli

      - name: deploy to railway
        run: railway up --service revix --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.TOKEN_RAILWAY_ACTION}}